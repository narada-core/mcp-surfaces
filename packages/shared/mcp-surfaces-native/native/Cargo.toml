[package]
name = "narada-mcp-surfaces-native"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-surfaces"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
