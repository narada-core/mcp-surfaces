[package]
name = "narada-mcp-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-runtime"
path = "src/main.rs"

[[bin]]
name = "narada-mcp-rhai-filesystem"
path = "src/rhai_main.rs"

[dependencies]
fs2 = "0.4"
hex = "0.4"
narada-mcp-materialization-contract = { path = "../../mcp-materialization-contract-native/native" }
rhai = { version = "1.25.1", default-features = false, features = [
  "std",
  "sync",
  "no_module",
  "no_index",
  "no_object",
  "no_custom_syntax",
  "no_position",
  "only_i64"
] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
