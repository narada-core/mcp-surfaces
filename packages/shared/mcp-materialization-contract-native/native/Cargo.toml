[package]
name = "narada-mcp-materialization-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "narada_mcp_materialization_contract"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
