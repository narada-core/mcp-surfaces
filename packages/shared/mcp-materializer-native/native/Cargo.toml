[package]
name = "narada-mcp-materializer"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-materializer"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
hex = "0.4"
narada-mcp-materialization-contract = { path = "../../mcp-materialization-contract-native/native" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
