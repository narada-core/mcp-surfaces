[package]
name = "narada-mcp-materializer"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-materializer"
path = "src/main.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
