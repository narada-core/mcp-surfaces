[package]
name = "narada-mcp-registrar"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-registrar"
path = "src/main.rs"

[dependencies]
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
