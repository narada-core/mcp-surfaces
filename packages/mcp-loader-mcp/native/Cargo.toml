[package]
name = "narada-mcp-loader"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-loader"
path = "src/main.rs"

[dependencies]
hex = "0.4"
narada-mcp-fabric-contracts = { path = "../../shared/mcp-fabric-contracts/native" }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
